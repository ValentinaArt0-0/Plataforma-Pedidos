spring.application.name=plataforma-pedidos
server.port=8080

# Conexión a MongoDB (se puede cambiar con la variable de entorno MONGODB_URI)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/plataforma_pedidos}

# Tasa de impuesto aplicada al subtotal del pedido (8 % = impuesto al consumo)
pedidos.impuesto.tasa=0.08
